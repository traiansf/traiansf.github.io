# Included only in the existing HTTPS VirtualHost for cs.unibuc.ro.
# Apache 2.4.47+ handles WebSocket upgrades through mod_proxy_http.
ProxyRequests Off
RedirectMatch 302 "^/~tserbanuta/amss$" "/~tserbanuta/amss/"
ProxyPass "/~tserbanuta/amss/" "http://127.0.0.1:3107/~tserbanuta/amss/" upgrade=websocket timeout=90
ProxyPassReverse "/~tserbanuta/amss/" "http://127.0.0.1:3107/~tserbanuta/amss/"
